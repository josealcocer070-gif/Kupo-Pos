<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUPO POS - Ventas</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;margin:0;padding:20px;text-align:center}
h1{color:#1d5f5e}
button{background:#e6714c;color:white;border:none;padding:12px 20px;font-size:18px;border-radius:10px;margin:5px}
#total{font-size:28px;font-weight:bold;color:#1d5f5e}
</style>
</head>
<body>
<h1>KUPO POS</h1>
<p>Punto de venta inteligente</p>
<button onclick="agregar(25)">Pan $25</button>
<button onclick="agregar(15)">Refresco $15</button>
<button onclick="agregar(40)">Pollo $40</button>
<p>Total: $<span id="total">0</span></p>
<button onclick="cobrar()">Cobrar</button>
<script>
let total=0;
function agregar(p){total+=p;document.getElementById('total').textContent=total;}
function cobrar(){alert('Total a cobrar: $'+total);total=0;document.getElementById('total').textContent=total;}
</script>
</body>
</html>
