<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#d95d1e">
<title>Ticket · Kupo Kiosko</title>
<script src="supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f4f8fb;color:#12233a;min-height:100vh}
.topo{background:linear-gradient(135deg,#d95d1e,#b34700);color:#fff;padding:20px 16px 16px;text-align:center}
.topo img{width:64px;height:64px;border-radius:50%;background:#fff;object-fit:cover;display:block;margin:0 auto 8px;border:3px solid rgba(255,255,255,.7)}
.topo .negocio{font-size:15px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;opacity:.95}
.topo .marca{font-size:12px;font-weight:700;opacity:.8;margin-top:2px}
.tarjeta{background:#fff;border-radius:20px;margin:-12px 16px 0;padding:24px 20px 20px;box-shadow:0 6px 24px rgba(0,0,0,.12);position:relative}
.tarjeta .tu-numero{font-size:14px;font-weight:800;color:#6b7280;letter-spacing:2px;text-align:center}
.tarjeta .numero{font-size:96px;font-weight:900;line-height:1;color:#d95d1e;text-align:center;margin:4px 0}
.tarjeta .cliente{font-size:20px;font-weight:800;text-align:center}
.tarjeta .modo{text-align:center;margin-top:6px}
.chip{display:inline-block;background:#fff8e1;border:1px solid #f5b800;color:#7c4a03;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:800}
.estado{text-align:center;margin-top:12px}
.estado .badge{display:inline-block;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:800}
.estado .badge.pendiente{background:#fef3c7;color:#92400e}
.estado .badge.cobrado{background:#dcfce7;color:#166534}
.items{margin-top:20px;border-top:2px dashed #e5e7eb;padding-top:14px}
.items .li{display:flex;justify-content:space-between;font-size:16px;padding:6px 0;border-bottom:1px solid #f3f4f6}
.items .li b{white-space:nowrap;margin-left:10px}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:900;border-top:2px dashed #e5e7eb;margin-top:12px;padding-top:12px}
.total b{color:#d95d1e;font-size:26px}
.fecha{font-size:13px;color:#9ca3af;text-align:center;margin-top:14px}
.nota{margin:18px 16px 0;background:#fff8e1;border:1px solid #f5b800;border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.5;text-align:center}
.nota b{color:#7c4a03}
.pie{text-align:center;font-size:12px;color:#9ca3af;margin:22px 0 28px}
.centro{max-width:480px;margin:0 auto;padding:60px 20px;text-align:center}
.centro .icono{font-size:64px}
.centro h1{font-size:24px;font-weight:900;margin:12px 0 8px}
.centro p{font-size:16px;color:#6b7280;line-height:1.5}
.centro button{margin-top:20px;padding:14px 28px;font-size:17px;font-weight:800;border-radius:12px;border:none;background:#d95d1e;color:#fff;cursor:pointer}
.cargando{font-size:16px;color:#6b7280;margin-top:16px}
</style>
</head>
<body>
<div id="app">
  <div class="centro"><div class="icono">🎫</div><h1>Cargando tu ticket…</h1><p class="cargando">Buscando tu pedido.</p></div>
</div>
<script>
/* Ticket virtual de Kupo Kiosko (Lalo 2026-11-27): el cliente escanea el QR del kiosco y ve su ticket en el celular, sin instalar nada. Lee el pedido de pedidos_kiosco por id + licencia y actualiza el estado cada 20 s (Pendiente de pago → Pagado). */
var SUPABASE_URL="https://zzyzvjmrsiwwjpebuggz.supabase.co";
var SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp6eXp2am1yc2l3d2pwZWJ1Z2d6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1MTEyMTYsImV4cCI6MjExMDA4NzIxNn0.Sqd5FgSIkEtjNSdD48dq7IsDcUc2cKk6LZveK56JooA";
var sb=null;
try{ sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}}); }catch(e){ sb=null; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function dinero(n){ return "$"+(Number(n)||0).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,","); }
function fechaCorta(iso){ try{ var d=new Date(iso); return d.toLocaleString("es-MX",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }
function errorTicket(titulo,texto){
  document.getElementById("app").innerHTML='<div class="centro"><div class="icono">🎫</div><h1>'+esc(titulo)+'</h1><p>'+esc(texto)+'</p><button onclick="location.reload()">Reintentar</button></div>';
}
function pintarTicket(pedido,negocio){
  var esCobrado=(pedido.estado||"")==="cobrado";
  var logo=(pedido.licencia_clave==="KUPO-EJNK-JDGZ")?"imagenes/logo-el-pollon-redondo.png":"imagenes/logo-kupo-kiosco.png";
  var items=Array.isArray(pedido.items)?pedido.items:[];
  var filas=items.map(function(it){
    var cant=Number(it.cant)||1, precio=Number(it.precio)||0;
    return '<div class="li"><span>'+cant+' × '+esc(it.nombre||"Producto")+'</span><b>'+dinero(precio*cant)+'</b></div>';
  }).join("");
  document.getElementById("app").innerHTML=
    '<div class="topo"><img src="'+logo+'" alt=""><div class="negocio">'+esc(negocio)+'</div><div class="marca">KUPO KIOSCO · TICKET VIRTUAL</div></div>'+
    '<div class="tarjeta"><div class="tu-numero">TU NÚMERO ES</div><div class="numero">'+esc(pedido.numero)+'</div>'+
    '<div class="cliente">'+esc(pedido.cliente||"")+'</div>'+
    '<div class="modo"><span class="chip">'+(pedido.tipo==="llevar"?"Para llevar":"Para comer aquí")+'</span></div>'+
    '<div class="estado"><span class="badge '+(esCobrado?"cobrado":"pendiente")+'">'+(esCobrado?"Pagado ✓":"Pendiente de pago")+'</span></div>'+
    '<div class="items">'+filas+'</div>'+
    '<div class="total"><span>Total</span><b>'+dinero(pedido.total)+'</b></div>'+
    '<div class="fecha">'+esc(fechaCorta(pedido.creado_en))+'</div></div>'+
    '<div class="nota"><b>Paga en caja.</b> Te llamaremos por tu número cuando esté listo.</div>'+
    '<div class="pie">Kupo Kiosko · Guarda este ticket en tu celular</div>';
}
var _pedidoId=null,_licencia=null,_timerTicket=null;
async function cargarTicket(){
  if(!sb){ errorTicket("Sin conexión","No se pudo conectar con la nube. Revisa tu internet y reintenta."); return; }
  var r=await sb.from("pedidos_kiosco").select("id,licencia_clave,numero,cliente,tipo,items,total,estado,creado_en").eq("id",_pedidoId).eq("licencia_clave",_licencia).maybeSingle();
  if(r.error||!r.data){ errorTicket("No encontramos este ticket","Revisa el QR o pide ayuda en caja."); return; }
  var negocio="KUPO KIOSCO";
  try{
    var rn=await sb.from("licencias").select("negocio").eq("clave",_licencia).maybeSingle();
    if(rn.data&&rn.data.negocio) negocio=rn.data.negocio;
  }catch(e){}
  pintarTicket(r.data,negocio);
  if((r.data.estado||"")==="cobrado"&&_timerTicket){ clearInterval(_timerTicket); _timerTicket=null; }
}
(function init(){
  var q=new URLSearchParams(location.search);
  _licencia=(q.get("licencia")||"").trim();
  _pedidoId=(q.get("pedido")||"").trim();
  if(!_licencia||!_pedidoId){ errorTicket("Falta el ticket","Abre este enlace desde el QR del kiosco."); return; }
  cargarTicket();
  _timerTicket=setInterval(cargarTicket,20000); /* el estado se actualiza solo (Pendiente → Pagado) */
})();
</script>
</body>
</html>
