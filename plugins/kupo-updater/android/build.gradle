apply plugin: 'com.android.library'

android {
    namespace "com.grupobenitez.kupoupdater"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    lintOptions {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    // FileProvider vive en androidx.core: los otros plugins no lo usan y por
    // eso compilan solo con capacitor-android, pero este plugin sí lo importa
    // (KupoUpdaterPlugin.java) y sin esta línea Gradle no lo ve al compilar.
    // Versión igual a la de Capacitor 7 para no chocar con la del sistema.
    implementation "androidx.core:core:1.13.1"
}
