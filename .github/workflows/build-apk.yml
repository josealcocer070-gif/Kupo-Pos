# KUPO POS — APK para Android (sin Play Store)
# Arma el APK con Capacitor en GitHub Actions y lo publica en el release
# "apk-latest" para instalarlo directo en el celular de un cliente.
# La PWA de GitHub Pages no se toca: el workflow solo lee la web del repo.
name: Build APK (KUPO POS)

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "movil.html"
      - "admin.html"
      - "manifest.json"
      - "manifest-movil.json"
      - "sw.js"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # para publicar el release apk-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web (www, entrada = movil.html)
        run: bash scripts/build-www.sh

      - name: Generate app icon (1024x1024, desde manifest.json)
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/make-icon.py

      - name: Add Android platform + icons
        run: |
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android

      - name: Set versionCode from run number
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text(encoding="utf-8")
          run = "${{ github.run_number }}"
          s2, n = re.subn(r"versionCode \d+", f"versionCode {run}", s, count=1)
          print("versionCode actualizado" if n else "AVISO: no se encontró versionCode")
          p.write_text(s2, encoding="utf-8")
          PY

      - name: Prepare release keystore (solo si hay secretos de firma)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/kupo-release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=kupo-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          python3 scripts/patch-signing.py
          echo "SIGNED_RELEASE=true" >> "$GITHUB_ENV"

      - name: Build debug APK
        if: ${{ env.SIGNED_RELEASE != 'true' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          echo "APK_PATH=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ env.SIGNED_RELEASE == 'true' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          echo "APK_PATH=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"

      - name: Prepare APK file
        run: |
          cp "$APK_PATH" kupo-pos.apk
          ls -lh kupo-pos.apk
          file kupo-pos.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kupo-pos-apk
          path: kupo-pos.apk
          if-no-files-found: error

      - name: Publish rolling release (apk-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "KUPO POS APK (última versión)"
          body: |
            APK para instalar directo en Android, sin Play Store.
            Descargar kupo-pos.apk e instalar permitiendo "instalar apps desconocidas".
            La app arranca en la versión móvil de KUPO POS V1.5.0.
            Sin secretos de firma este APK es debug: para actualizar hay que desinstalar antes (ver APK-README.md).
          files: kupo-pos.apk
          fail_on_unmatched_files: true
